<title>PieceWork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#EEF3F8; --surface:#FFFFFF; --surface-2:#F5F8FC; --line:#D5DFEA;
  --ink:#0E1A2B; --ink-2:#4A5A70; --ink-3:#7A889B;
  --accent:#0A74E8; --accent-ink:#FFFFFF; --accent-soft:#E1EEFD;
  --money:#0B8F7F; --money-soft:#DDF3EF;
  --warn:#A86200; --warn-soft:#FDF0DA;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Archivo", "Source Sans 3", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A111C; --surface:#111B2A; --surface-2:#0E1724; --line:#243349;
    --ink:#E4ECF6; --ink-2:#A6B4C7; --ink-3:#7485A0;
    --accent:#4C9DFF; --accent-ink:#06121F; --accent-soft:#132A47;
    --money:#3CC7B3; --money-soft:#0F2E2B;
    --warn:#F0AE4A; --warn-soft:#33250F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0A111C; --surface:#111B2A; --surface-2:#0E1724; --line:#243349;
  --ink:#E4ECF6; --ink-2:#A6B4C7; --ink-3:#7485A0;
  --accent:#4C9DFF; --accent-ink:#06121F; --accent-soft:#132A47;
  --money:#3CC7B3; --money-soft:#0F2E2B;
  --warn:#F0AE4A; --warn-soft:#33250F;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:17px/1.55 var(--body);margin:0;padding:28px 16px 48px}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(2.1rem,5vw,3rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{font-size:clamp(1.35rem,3vw,1.7rem);font-weight:700;letter-spacing:-.01em}
.eyebrow{font:600 .75rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--ink-2);max-width:62ch;margin:0}
a{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.choice{text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.choice:hover{border-color:var(--accent)}
.choice .k{font:600 .75rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.choice h3{font-size:1.25rem}
.choice p{margin:0;color:var(--ink-2)}
.choice .go{margin-top:6px;font-weight:600;color:var(--accent)}
.scene{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:10px}
.actor{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.actor .who{display:flex;align-items:center;gap:8px;font:600 .8rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.actor .who svg{width:20px;height:20px;flex:none;color:var(--ink-2)}
.actor .big{font:600 1.6rem var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.actor .unit{font:500 .8rem var(--mono);color:var(--ink-3)}
.actor .note{color:var(--ink-2);font-size:.9rem}
.actor.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.actor.pay .big{color:var(--warn)}
.actor.prov .big{color:var(--money)}
.flow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:74px;text-align:center;font-size:.78rem;color:var(--ink-3)}
.flow .arr{font:700 1.4rem var(--body);color:var(--line)}
.flow.on .arr{color:var(--money)}
.flow.on{color:var(--money);font-weight:600}
.flow.back .arr{color:var(--accent)}
.flow.back{color:var(--accent);font-weight:600}
@media (max-width:720px){
  .scene{grid-template-columns:1fr}
  .flow{flex-direction:row;min-width:0;gap:8px}
  .flow .arr{transform:rotate(90deg)}
}
.files{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.86rem}
.files li{display:flex;justify-content:space-between;gap:8px}
.files .sz{font:.78rem var(--mono);color:var(--ink-3);white-space:nowrap}
.files li.new{color:var(--money);font-weight:600}
.files li.busy{color:var(--warn)}
.files li.done::after{content:" ✓";color:var(--money)}
.text{display:flex;flex-direction:column;gap:10px;max-width:68ch}
.text p{margin:0;color:var(--ink-2)}
.text b{color:var(--ink)}
.live{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border-radius:10px;padding:10px 14px;background:var(--surface-2);border:1px solid var(--line)}
.stat .l{font-size:.8rem;color:var(--ink-3)}
.stat .v{font:600 1.35rem var(--mono);font-variant-numeric:tabular-nums}
.stat.clock .v{color:var(--accent)}
.stat.late .v{color:var(--warn)}
.bubble{border-radius:12px;padding:10px 14px;background:var(--accent-soft);font-size:.95rem}
.bubble .q{font-weight:600}
.bubble .a{color:var(--ink-2)}
.callout{border-radius:12px;padding:12px 16px;background:var(--money-soft);color:var(--ink)}
.callout.warn{background:var(--warn-soft)}
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav .sp{flex:1}
.dots{display:flex;gap:6px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent)}
button.b{font:600 1rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:9px;cursor:pointer}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.b:disabled{opacity:.4;cursor:not-allowed}
button.b:hover:not(:disabled){border-color:var(--accent)}
a.b{display:inline-block;text-decoration:none;text-align:center}
button:focus-visible,.choice:focus-visible,a.b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .35s}
footer{color:var(--ink-3);font-size:.85rem;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:reduce){.progress span{transition:none}}
</style>

<div class="wrap" id="app"></div>

<script>
(() => {
  const EXPLORER = "https://claude.ai/artifact/HSqjVvT9BTdUWyxxoNBXct";
  const RATE = 0.0167, DEPOSIT = 0.17, WALLET = 5, JOB_PRICE = 0.5, DEADLINE_STEPS = 20;
  const money = x => x.toFixed(2);
  const clock = steps => { const s = Math.max(0, steps) * 30; return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const duration = steps => { const s = steps * 30; const m = Math.floor(s / 60); return m ? `${m} min${s % 60 ? " 30 s" : ""}` : `${s} s`; };

  const icon = {
    you: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>`,
    pay: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M8 15h3"/></svg>`,
    prov: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/><path d="M8 6.5h.01M8 17.5h.01"/></svg>`
  };
  const FILES = [["product-manuals", "2.1 GB"], ["support-tickets", "840 MB"], ["meeting-notes", "150 MB"]];

  // live state
  let st = { story: null, i: 0, ticks: 0, asked: 0, timer: null, jobTicks: 0, wA: WALLET, pA: 0, nA: 1, wB: WALLET, pB: 0, nB: 1 };
  const fresh = () => ({ story: null, i: 0, ticks: 0, asked: 0, timer: null, jobTicks: 0, wA: WALLET, pA: 0, nA: 1, wB: WALLET, pB: 0, nB: 1 });

  function scene(o) {
    const files = (o.files || FILES.map(f => ({ n: f[0], s: f[1] }))).map(f => `<li class="${f.c || ""}"><span>${f.n}</span><span class="sz">${f.s}</span></li>`).join("");
    const flow = (f) => f ? `<div class="flow ${f.cls || ""}"><span class="arr">→</span><span>${f.t}</span></div>` : `<div class="flow"><span class="arr">→</span></div>`;
    const flowL = (f) => f ? `<div class="flow ${f.cls || ""}"><span class="arr">${f.cls === "back" ? "←" : "→"}</span><span>${f.t}</span></div>` : `<div class="flow"><span class="arr">→</span></div>`;
    return `<div class="scene">
      <div class="actor ${o.hl === "you" ? "hl" : ""}"><div class="who">${icon.you}You</div><div class="big">${money(o.you)}</div><div class="unit">USDFC, your balance in Filecoin Pay</div>${o.youNote ? `<div class="note">${o.youNote}</div>` : ""}</div>
      ${flowL(o.f1)}
      <div class="actor pay ${o.hl === "pay" ? "hl" : ""}"><div class="who">${icon.pay}On hold in Filecoin Pay</div><div class="big">${money(o.pay)}</div><div class="unit">${o.payLabel || "held"}</div>${o.payNote ? `<div class="note">${o.payNote}</div>` : ""}</div>
      ${flow(o.f2)}
      <div class="actor prov ${o.hl === "prov" ? "hl" : ""}"><div class="who">${icon.prov}Storage provider</div><div class="big">${money(o.prov)}</div><div class="unit">USDFC earned</div><div class="note">${o.provNote || "Stores your PDP data set and proves possession daily."}</div><ul class="files">${files}</ul></div>
    </div>`;
  }

  // ---------------- Story A: rent an AI assistant ----------------
  const cost = () => st.ticks * RATE;
  const A = [
    () => ({
      title: "Your files are already stored on Filecoin",
      text: `<p>You keep your company documents on Filecoin with a <b>storage provider</b>, in a <b>PDP data set</b>: with PDP (Proof of Data Possession), the provider proves on-chain, every day, that it still holds every file.</p>
             <p>You have already <b>deposited ${money(WALLET)} USDFC</b> (a dollar stablecoin) from your crypto wallet into <b>Filecoin Pay</b>, the payment contract between you and providers — like topping up a prepaid account. Providers can only be paid from it according to rules you agreed to.</p>
             <p>Now you'd like an <b>AI assistant</b> that can answer questions about these documents — without downloading them anywhere.</p>`,
      scene: { you: WALLET, pay: 0, payLabel: "nothing held yet", prov: 0 }
    }),
    () => ({
      title: st.nA > 1 ? `You rent the AI assistant again (session ${st.nA})` : "You rent the AI assistant — right next to your files",
      text: `<p>The provider runs the assistant <b>on its own machines, where your files already are</b>. The price is like a taxi meter: <b>2 USDFC per hour</b>, counted every 30 seconds.</p>
             <p>When it starts, Filecoin Pay puts a small amount of your balance <b>on hold</b> (${money(DEPOSIT)} USDFC, five minutes' worth). It is only used if your balance runs out — if you stop normally, it is released.</p>`,
      scene: { you: st.wA - DEPOSIT, pay: DEPOSIT, payLabel: "safety margin", f1: { t: "put on hold", cls: "on" }, prov: st.pA, provNote: "Starting the AI assistant next to your files…", hl: "pay" }
    }),
    () => {
      const q = [["What is our refund policy?", "Refunds within 30 days, per the product manuals (section 4)."], ["What were last month's top complaints?", "Late deliveries and the X200 pump manual, from 38 support tickets."], ["When is the launch?", "October 14, decided in the Sept 3 meeting notes."]];
      const shown = q.slice(0, st.asked);
      return {
        title: "The meter is running",
        live: "meter",
        text: `<p>Every 30 seconds, ${RATE} USDFC is counted for the provider. Ask the assistant anything — you pay for the <b>time</b>, not per question.</p>
               <p>When you're done, press <b>Stop</b>.</p>`,
        extra: `<div class="live"><div class="stat clock"><div class="l">Time used</div><div class="v">${clock(st.ticks)}</div></div><div class="stat"><div class="l">Cost so far</div><div class="v">${cost().toFixed(4)}</div></div></div>
                ${shown.map(([qq, aa]) => `<div class="bubble"><div class="q">You: ${qq}</div><div class="a">Assistant: ${aa}</div></div>`).join("")}
                <div class="nav"><button class="b" id="ask" ${st.asked >= q.length ? "disabled" : ""}>Ask a question</button><button class="b primary" id="stop">Stop</button></div>`,
        scene: { you: st.wA - DEPOSIT - cost(), pay: DEPOSIT + 0, payLabel: "safety margin", f1: { t: `${RATE}/30 s`, cls: "on" }, f2: { t: "counted for the provider", cls: "on" }, prov: st.pA, provNote: `<b>Owed so far: ${cost().toFixed(4)}</b> — paid when you stop.`, hl: "prov" },
        hideNext: true
      };
    },
    () => {
      const c = cost(), f = c * 0.005;
      return {
        title: "You pressed Stop — the meter stopped right away",
        text: `<p>Filecoin Pay paid the provider for <b>exactly ${duration(st.ticks)}</b> of use: ${c.toFixed(4)} USDFC (minus a 0.5% network fee). Not a second more.</p>
               <p>The amount on hold was released back to your balance.</p>`,
        scene: { you: st.wA - c, pay: 0, payLabel: "nothing held", f1: { t: "hold released", cls: "back" }, f2: { t: `${c.toFixed(4)} paid`, cls: "on" }, prov: st.pA + c - f, provNote: "Paid for the time used.", hl: "you" },
        again: "Rent again"
      };
    },
    () => ({
      title: "That's it",
      text: `<p><b>You rented an AI model next to your own files, paid by the half-minute, and stopped whenever you wanted.</b> Your files never left the provider, and nobody could charge you more than the time you used.</p>
             <p>One question remains: why put anything on hold?</p>`,
      scene: { you: st.wA - cost(), pay: 0, payLabel: "nothing held", prov: st.pA + cost() * 0.995 },
      bonus: { label: "What if my balance runs out?", go: 5 }, again: "Rent again"
    }),
    () => ({
      title: "If your balance runs out, the amount on hold pays the provider",
      text: `<p>Filecoin Pay can't pay out money that isn't there — but the provider's machine doesn't switch off by itself. It needs a moment to notice and stop.</p>
             <p>The amount on hold covers exactly that moment: the provider is paid for <b>at most five more minutes</b>, then stops. That's why providers can serve you without asking you to prepay.</p>`,
      scene: { you: 0, pay: 0, payLabel: "used to pay the provider", f2: { t: "hold → provider", cls: "on" }, prov: 0.40 * 0.995, provNote: "Example: your balance was 0.40. It covered 7 minutes; the amount on hold paid 5 more. Then the provider stopped.", hl: "pay" },
      callout: `<div class="callout warn">Like a hotel putting a hold on your card: you only pay it if something goes wrong.</div>`
    })
  ];

  // ---------------- Story B: order a job ----------------
  const JOB_STEPS = 7;   // steps the provider needs (3 min 30 s)
  const jobFiles = () => {
    const t = st.jobTicks;
    return [
      { n: "product-manuals", s: "2.1 GB", c: t >= 3 ? "done" : t >= 1 ? "busy" : "" },
      { n: "support-tickets", s: "840 MB", c: t >= 6 ? "done" : t >= 4 ? "busy" : "" },
      { n: "meeting-notes", s: "150 MB" }
    ];
  };
  const B = [
    () => ({
      title: "You need a search index of your documents",
      text: `<p>You want an AI to be able to search your manuals and support tickets. That means building a <b>search index</b> — a job that reads ~3 GB of files.</p>
             <p>Instead of downloading everything, you ask the <b>storage provider</b> — which keeps these files in your PDP data set — to do it where the files already are, and pay <b>once</b> when it's done. You pay from the ${money(WALLET)} USDFC you have deposited in <b>Filecoin Pay</b>.</p>`,
      scene: { you: WALLET, pay: 0, payLabel: "nothing held yet", prov: 0 }
    }),
    () => ({
      title: st.nB > 1 ? `You order another job (job ${st.nB}): 0.50 USDFC, within 10 minutes` : "You order the job: 0.50 USDFC, done within 10 minutes",
      text: `<p>Filecoin Pay <b>locks the 0.50</b> right away: the provider can't take it yet, and you can't spend it.</p>
             <p>The <b>deadline</b> is recorded on Filecoin: 10 minutes from now.</p>`,
      scene: { you: st.wB - JOB_PRICE, pay: JOB_PRICE, payLabel: "locked for the job", f1: { t: "price locked", cls: "on" }, prov: st.pB, provNote: "Job received. Deadline in 10:00.", hl: "pay" }
    }),
    () => {
      const done = st.jobTicks >= JOB_STEPS;
      return {
        title: done ? "Done — delivered with time to spare" : "The provider is working on your files",
        live: done ? null : "job",
        text: done
          ? `<p>The provider finished and submitted the result at <b>${clock(JOB_STEPS)}</b>. The deadline was <b>10:00</b>.</p>`
          : `<p>It reads your files one by one, directly from its own storage, and builds the index.</p>`,
        extra: `<div class="live"><div class="stat clock"><div class="l">Time since order</div><div class="v">${clock(Math.min(st.jobTicks, JOB_STEPS))}</div></div><div class="stat"><div class="l">Deadline</div><div class="v">10:00</div></div></div>
                <div class="progress"><span style="width:${Math.min(100, Math.round(100 * st.jobTicks / JOB_STEPS))}%"></span></div>`,
        scene: { you: st.wB - JOB_PRICE, pay: JOB_PRICE, payLabel: "locked for the job", prov: st.pB, provNote: done ? "Result ready." : "Working…", files: jobFiles(), hl: "prov" },
        nextDisabled: !done
      };
    },
    () => ({
      title: "Delivered on time, so the provider is paid",
      text: `<p>The result (<b>search-index</b>) is added to your PDP data set as a new piece, stored and proven like the rest of your files (at the normal storage price).</p>
             <p><b>How does Filecoin Pay know it was on time?</b> Every action on Filecoin is stamped with the moment it happens. The contract compares the delivery stamp (${clock(JOB_STEPS)}) with the deadline (10:00) — like a postmark on a letter. Before the deadline, it releases the 0.50 to the provider.</p>`,
      scene: { you: st.wB - JOB_PRICE, pay: 0, payLabel: "released", f2: { t: "0.50 paid", cls: "on" }, prov: st.pB + JOB_PRICE * 0.995, provNote: "Paid on delivery.", files: [...jobFiles().slice(0, 3).map(f => ({ ...f, c: f.c === "done" ? "done" : "" })), { n: "search-index (new)", s: "310 MB", c: "new" }], hl: "prov" }
    }),
    () => ({
      title: "That's it",
      text: `<p><b>You ordered work on your own files, paid once, and only because it was delivered on time.</b> Your files never left the provider.</p>
             <p>And if the provider had been late?</p>`,
      scene: { you: st.wB - JOB_PRICE, pay: 0, payLabel: "nothing held", prov: st.pB + JOB_PRICE * 0.995, files: [...FILES.map(f => ({ n: f[0], s: f[1] })), { n: "search-index (new)", s: "310 MB", c: "new" }] },
      bonus: { label: "What if the provider is late?", go: 5 }, again: "Order another job"
    }),
    () => ({
      title: "If it's late, your money comes back",
      text: `<p>The clock reaches <b>10:00</b> with no result. From that moment Filecoin Pay <b>refuses any delivery</b> for this job — it's past the postmark date.</p>
             <p>Anyone can then cancel the job, and the locked 0.50 goes straight back to your balance.</p>`,
      scene: { you: WALLET, pay: 0, payLabel: "returned", f1: { t: "0.50 back to you", cls: "back" }, prov: 0, provNote: "Missed the deadline: not paid.", hl: "you" },
      callout: `<div class="callout">The contract doesn't judge the quality of the work — like any cloud provider, it guarantees delivery on time and a fair charge.</div>`
    })
  ];

  const STORIES = { A: { name: "Rent an AI assistant", steps: A }, B: { name: "Order a job", steps: B } };

  function stopTimer() { if (st.timer) { clearInterval(st.timer); st.timer = null; } }

  function home() {
    stopTimer();
    st = fresh();
    document.getElementById("app").innerHTML = `
      <header style="display:flex;flex-direction:column;gap:10px">
        <div class="eyebrow">Filecoin Onchain Cloud · prototype · 2-minute explainer</div>
        <h1>PieceWork</h1>
        <p class="lede"><b>Compute where your data already lives.</b> The storage provider that keeps your files on Filecoin (in a PDP data set, proven daily) can also work on them — right where they are — and Filecoin Pay makes sure everyone is paid fairly.</p>
      </header>
      <div class="choices">
        <button class="choice" data-s="A"><span class="k">Pay for time</span><h3>Rent an AI assistant for your documents</h3><p>Like a taxi meter: pay every 30 seconds while you use it, stop whenever you want.</p><span class="go">Start · 5 short steps →</span></button>
        <button class="choice" data-s="B"><span class="k">Pay per job</span><h3>Order a job on your files</h3><p>Like a print shop: pay once, and only if the result is delivered on time.</p><span class="go">Start · 5 short steps →</span></button>
      </div>
      <div class="nav"><span style="color:var(--ink-2)">Two short stories explain the idea. Then try it yourself.</span><span class="sp"></span><a class="b primary" href="${EXPLORER}" target="_blank" rel="noopener">Try the full experience →</a></div>
      <section class="card" style="display:flex;flex-direction:column;gap:8px"><h3 style="font-size:1.05rem">Good to know</h3><div class="text" style="max-width:none"><p><b>AI agents can use it too.</b> An agent can rent a service or order a job on your behalf through an API, paying from your Filecoin Pay balance within the limits you set.</p><p><b>Quality is not checked — yet.</b> Like commercial GPU clouds, the contract guarantees delivery on time and a fair charge, not the quality of the result. Proofs of correct execution can be added later: zero-knowledge proofs for simple jobs, secure hardware (TEEs) for AI workloads.</p></div></section>
      <footer><span>A simulation: no real money, no wallet needed. The payment rules follow the real Filecoin Pay contract.</span><span>Ready to try it yourself? <a href="${EXPLORER}" target="_blank" rel="noopener">Open the full experience</a> — pick services, watch your files and every payment.</span></footer>`;
    document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { st.story = b.dataset.s; st.i = 0; show(); });
  }

  function show() {
    stopTimer();
    const S = STORIES[st.story], steps = S.steps, s = steps[st.i]();
    const mainSteps = 5, idx = Math.min(st.i, mainSteps - 1);
    document.getElementById("app").innerHTML = `
      <div class="nav"><button class="b" id="home">← All stories</button><span class="sp"></span><div class="dots">${Array.from({ length: mainSteps }, (_, k) => `<span class="${k <= idx ? "on" : ""}"></span>`).join("")}</div></div>
      <section class="card" style="display:flex;flex-direction:column;gap:18px">
        <div class="eyebrow">${S.name}${st.i >= mainSteps ? " · what if" : ` · step ${st.i + 1} of ${mainSteps}`}</div>
        <h2>${s.title}</h2>
        <div class="text">${s.text}</div>
        ${s.extra || ""}
        ${scene(s.scene)}
        ${s.callout || ""}
        <div class="nav">
          <button class="b" id="back" ${st.i === 0 ? "disabled" : ""}>Back</button><span class="sp"></span>
          ${s.again ? `<button class="b primary" id="again">${s.again}</button>` : ""}
          ${s.bonus ? `<a class="b" href="${EXPLORER}" target="_blank" rel="noopener">Try the full experience →</a><button class="b" id="bonus">${s.bonus.label}</button><button class="b" id="other">${st.story === "A" ? "Go to pay per job" : "Go to pay for time"}</button>` : ""}
          ${!s.bonus && !s.hideNext && st.i < mainSteps - 1 ? `<button class="b primary" id="next" ${s.nextDisabled ? "disabled" : ""}>Next</button>` : ""}
          ${st.i >= mainSteps ? `<button class="b primary" id="other">${st.story === "A" ? "Go to pay per job" : "Go to pay for time"}</button>` : ""}
        </div>
      </section>
      <footer><span>A simulation: no real money. The payment rules follow the real Filecoin Pay contract. <a href="${EXPLORER}" target="_blank" rel="noopener">Try the full experience</a>.</span></footer>`;
    const on = (id, fn) => { const e = document.getElementById(id); if (e) e.onclick = fn; };
    on("home", home);
    on("back", () => { st.i = st.i >= mainSteps ? mainSteps - 1 : st.i - 1; if (st.story === "A" && st.i <= 2) { st.ticks = 0; st.asked = 0; } if (st.story === "B" && st.i <= 2) st.jobTicks = 0; show(); });
    on("next", () => { st.i++; show(); });
    on("bonus", () => { st.i = s.bonus.go; show(); });
    on("other", () => { const o = st.story === "A" ? "B" : "A"; st = fresh(); st.story = o; show(); });
    on("again", () => {
      if (st.story === "A") { const c = cost(); st.wA -= c; st.pA += c * 0.995; st.nA++; st.ticks = 0; st.asked = 0; }
      else { st.wB -= JOB_PRICE; st.pB += JOB_PRICE * 0.995; st.nB++; st.jobTicks = 0; }
      st.i = 1; show();
    });
    on("ask", () => { st.asked++; show(); });
    on("stop", () => { if (st.ticks === 0) st.ticks = 1; st.i++; show(); });
    if (s.live === "meter") st.timer = setInterval(() => { st.ticks++; show(); }, 700);
    if (s.live === "job") st.timer = setInterval(() => { st.jobTicks++; show(); }, 600);
  }

  home();
})();
</script>
