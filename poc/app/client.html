<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PieceWork Client Console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<style>
:root{--ground:#EEF3F8;--surface:#fff;--surface-2:#F5F8FC;--line:#D5DFEA;--ink:#0E1A2B;--ink-2:#4A5A70;--ink-3:#7A889B;
  --accent:#0A74E8;--accent-ink:#fff;--accent-soft:#E1EEFD;--money:#0B8F7F;--money-soft:#DDF3EF;--warn:#A86200;--warn-soft:#FDF0DA;--bad:#B42318;--bad-soft:#FDE7E5;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;--body:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0A111C;--surface:#111B2A;--surface-2:#0E1724;--line:#243349;--ink:#E4ECF6;
  --ink-2:#A6B4C7;--ink-3:#7485A0;--accent:#4C9DFF;--accent-ink:#06121F;--accent-soft:#132A47;--money:#3CC7B3;--money-soft:#0F2E2B;--warn:#F0AE4A;--warn-soft:#33250F;--bad:#FF7A6E;--bad-soft:#3A1614}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);padding:24px 16px 48px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.7rem;margin:0} h2{font-size:1.15rem;margin:0 0 10px}
.muted{color:var(--ink-3);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.providers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.prov{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface-2);cursor:pointer;text-align:left;font:inherit;color:inherit}
.prov.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.prov[disabled]{opacity:.55;cursor:not-allowed}
.prov b{display:block;margin-bottom:4px}
code{font:.82rem var(--mono);word-break:break-all}
button.b{font:600 .95rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.b:disabled{opacity:.45;cursor:not-allowed}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.tw{overflow-x:auto}
.pill{display:inline-block;font:600 .72rem var(--body);letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.paid,.pill.ok{background:var(--money-soft);color:var(--money)} .pill.late,.pill.expired,.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.off{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.task{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 16px}
.task.err{border-color:var(--bad);background:var(--bad-soft)}
.task ol{margin:6px 0 0;padding-left:20px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
pre{font:.8rem/1.5 var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:420px;overflow:auto;margin:0;white-space:pre-wrap}
a{color:var(--accent);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="muted">PieceWork · client console · this Mac only</div>
    <h1>Act as a client</h1>
    <div class="muted" id="who">Loading…</div>
  </div>
  <div id="task"></div>
  <div class="card"><h2>1. Choose a provider</h2>
    <p class="muted" style="margin:0 0 10px">Providers are listed in <code>poc/providers.json</code>. Each one runs Curio with PDP and the PieceWork provider kit.</p>
    <div class="providers" id="providers"></div></div>
  <div class="card" id="setcard"></div>
  <div class="card" id="ordercard"></div>
  <div class="card"><h2>Your jobs</h2><div class="tw"><table><thead><tr><th>Job</th><th>Provider</th><th>Status</th><th>Results</th><th>Transactions</th></tr></thead>
    <tbody id="jobs"></tbody></table></div></div>
  <div class="card" id="viewer" hidden></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let S = null, pick = localStorage.getItem("pilot-provider") ?? "laptop", jobType = null;
const busy = () => S?.task && !S.task.done;
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then((x) => x.json());
  if (r.error) alert(r.error);
  refresh();
}
async function view(provider, pieceId, name) {
  const v = $("viewer"); v.hidden = false;
  v.innerHTML = `<h2>${esc(name)}</h2><p class="muted">Read back from the provider's Curio.</p><pre>Loading…</pre>`;
  const t = await fetch(`/api/pilot/file/${provider}/${pieceId}`).then((r) => r.text());
  v.querySelector("pre").textContent = t; v.scrollIntoView({ behavior: "smooth" });
}
function upload(input) {
  const f = input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => post("/api/pilot/upload", { provider: pick, name: f.name, data: rd.result.split(",")[1] });
  rd.readAsDataURL(f);
}
function render() {
  const tx = (h, label) => h ? `<a href="${S.explorer}${h}" target="_blank" rel="noopener">${label}</a>` : "";
  $("who").innerHTML = `You are the client <code>${esc(S.client)}</code> (the demo wallet: test tokens only) · ${Number(S.available).toFixed(3)} ${esc(S.token)} available in Filecoin Pay`;
  const t = S.task;
  $("task").innerHTML = t ? `<div class="task ${t.error ? "err" : ""}"><b>${t.done ? (t.error ? "Failed: " : "Done: ") : '<span class="spin"></span>'}${esc(t.title)}</b>
    <ol>${t.steps.map((s) => `<li>${s.done ? "✓" : "…"} ${esc(s.text)}</li>`).join("")}</ol>${t.error ? `<div>${esc(t.error)}</div>` : ""}
    ${t.done ? "" : '<div class="muted">Each step waits for a block on Filecoin Calibration (about 30–60 s).</div>'}</div>` : "";
  $("providers").innerHTML = S.providers.map((p) => `<button class="prov ${p.id === pick ? "on" : ""}" data-p="${esc(p.id)}" ${p.ready ? "" : "disabled"}>
    <b>${esc(p.name)}</b><span class="muted">${esc(p.note ?? "")}</span><br>
    ${p.ready ? `<span class="pill ${p.reachable ? "ok" : "bad"}">${p.reachable ? "Curio reachable" : "Curio not reachable"}</span>
      <span class="pill off">${p.set ? `data set #${p.set.dataSetId}` : "no data set yet"}</span>` : '<span class="pill off">not set up yet</span>'}</button>`).join("");
  document.querySelectorAll(".prov").forEach((b) => (b.onclick = () => { pick = b.dataset.p; localStorage.setItem("pilot-provider", pick); render(); }));
  const P = S.providers.find((p) => p.id === pick) ?? S.providers[0];
  const files = Object.entries(P.set?.files ?? {}).sort((a, b) => Number(a[0]) - Number(b[0]));
  $("setcard").innerHTML = `<h2>2. Your data set with ${esc(P.name)}</h2>` + (!P.set
    ? `<p class="muted">You have no data set with this provider yet. Storing creates one, adds eight synthetic financial documents (loan agreements, KYC forms,
       invoices, trade confirmations, all with fake people and accounts), and lets providers add job results while you have a job open.</p>
       <button class="b primary" onclick="post('/api/pilot/store',{provider:'${esc(P.id)}'})" ${busy() || !P.ready ? "disabled" : ""}>Store the sample documents with this provider</button>`
    : `<p class="muted">Data set #${P.set.dataSetId}: ${files.length} pieces, stored and proven by the provider. Click a name to read the file back from the provider.</p>
       <div class="tw"><table><thead><tr><th>Piece</th><th>File</th><th>What</th></tr></thead><tbody>${files.map(([id, f]) =>
       `<tr><td>#${id}</td><td><a onclick="view('${esc(P.id)}','${id}','${esc(f.name)}')">${esc(f.name)}</a></td><td>${f.kind === "output" ? '<span class="pill paid">job result</span>' : "your file"}</td></tr>`).join("")}</tbody></table></div>
       <div class="row" style="margin-top:12px"><label class="b">Upload a file of yours<input type="file" hidden onchange="upload(this)" ${busy() ? "disabled" : ""}></label>
       <span class="muted">Text files work with the jobs below. Stored in your data set at this provider; one signature, one block.</span></div>`);
  jobType = jobType ?? S.jobTypes[0]?.type;
  $("ordercard").innerHTML = `<h2>3. Order a job from ${esc(P.name)}</h2>
    <p class="muted">The price is put on hold in Filecoin Pay. The provider runs the program next to your files, adds the results to your data set, and is paid
    only if it does so before the deadline (about 20 minutes).</p>
    <div class="row"><select id="jt">${S.jobTypes.map((j) => `<option value="${esc(j.type)}" ${j.type === jobType ? "selected" : ""}>${esc(j.name)} — ${esc(j.price)} ${esc(S.token)}</option>`).join("")}</select>
    <button class="b primary" id="orderbtn" ${busy() || !P.set ? "disabled" : ""}>Order</button></div>`;
  $("jt").onchange = (e) => (jobType = e.target.value);
  $("orderbtn").onclick = () => post("/api/pilot/order", { provider: P.id, type: jobType });
  const status = { waiting: "waiting for the provider", paid: "delivered and paid", late: "late: deadline passed", expired: "refunded" };
  $("jobs").innerHTML = S.jobs.map((j) => `<tr><td>#${esc(j.id)} ${esc(j.name)}<br><span class="muted">${j.inputs} files · ${esc(j.price)} ${esc(S.token)}</span></td>
    <td>${esc(S.providers.find((p) => p.id === j.provider)?.name ?? j.provider)}</td>
    <td><span class="pill ${esc(j.status)}">${esc(status[j.status] ?? j.status ?? "…")}</span></td>
    <td>${(j.outputs ?? []).map((o) => `<a onclick="view('${esc(j.provider)}','${o.pieceId}','${esc(o.name)} (job #${esc(j.id)})')">${esc(o.name)}</a> <span class="muted">#${o.pieceId}</span>`).join("<br>")}</td>
    <td>${[tx(j.postTx, "ordered"), tx(j.paidTx, "paid"), tx(j.expireTx, "refunded")].filter(Boolean).join(" · ")}
      ${j.status === "late" ? `<div><button class="b" onclick="post('/api/pilot/expire',{jobId:'${esc(j.id)}'})" ${busy() ? "disabled" : ""}>Get my money back</button></div>` : ""}</td></tr>`).join("")
    || `<tr><td colspan="5" class="muted">No jobs ordered from this console yet.</td></tr>`;
}
async function refresh() {
  try { S = await fetch("/api/pilot/state").then((r) => r.json()); if (S.error) throw new Error(S.error); render(); }
  catch (e) { $("who").textContent = `The console is not available: ${e.message}`; }
}
refresh(); setInterval(refresh, 6000);
</script>
</body>
</html>
